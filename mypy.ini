# Strict typing for the Nature Remo custom integration (HA Quality Scale: strict-typing).
# Home Assistant 2025.1 + Python 3.12. Run: mypy custom_components/nature_remo
[mypy]
python_version = 3.12
strict = true
show_error_codes = true
pretty = true
warn_unused_ignores = true
warn_unreachable = true
packages = custom_components.nature_remo

[mypy-voluptuous]
ignore_missing_imports = true

[mypy-voluptuous.*]
ignore_missing_imports = true
