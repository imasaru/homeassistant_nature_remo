# Integration Quality Scale status for this fork (custom integration).
# Rule list: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules (54 rules, fetched 2026-11-13)
rules:
  # Bronze
  action-setup:
    status: done
    comment: >-
      send_light_mode is registered once in async_setup (CONFIG_SCHEMA is config-entry only).
  appropriate-polling:
    status: done
    comment: >-
      60 s default (2 cloud calls per poll, within Nature's 30 requests / 5 min), user-adjustable in options.
  brands:
    status: todo
    comment: >-
      No logo/icon in home-assistant/brands custom_integrations yet.
  common-modules:
    status: todo
    comment: >-
      coordinator.py exists; a shared entity.py base class does not.
  config-flow:
    status: done
    comment: >-
      UI setup with token check, data_description, token in data and settings in options.
  config-flow-test-coverage:
    status: done
    comment: >-
      tests/test_config_flow.py: success, each error with recovery, duplicates, reauth, reconfigure.
  dependency-transparency:
    status: done
    comment: >-
      Only aiohttp, which Home Assistant ships.
  docs-actions:
    status: done
    comment: >-
      README 'Actions' section.
  docs-conditions:
    status: exempt
    comment: >-
      The integration provides no conditions.
  docs-high-level-description:
    status: done
    comment: >-
      README describes Nature Remo and what the integration controls.
  docs-installation-instructions:
    status: done
    comment: >-
      README has HACS and manual install steps.
  docs-removal-instructions:
    status: done
    comment: >-
      README 'Removing the integration' section.
  docs-triggers:
    status: exempt
    comment: >-
      The integration provides no triggers.
  entity-event-setup:
    status: done
    comment: >-
      Listeners use async_on_remove (climate, light) or CoordinatorEntity (sensor, remote); the light action map is cleared on removal.
  entity-unique-id:
    status: done
    comment: >-
      All entities set unique ids (nature_remo_<platform>_<appliance_id>); unchanged by this branch.
  has-entity-name:
    status: todo
    comment: >-
      Not set yet. Safe for entity ids (they live in the registry) but changes friendly names, so do it deliberately.
  runtime-data:
    status: done
    comment: >-
      entry.runtime_data holds the API client and coordinator; hass.data is no longer used.
  test-before-configure:
    status: done
    comment: >-
      Config flow calls GET /1/users/me before creating the entry.
  test-before-setup:
    status: done
    comment: >-
      Setup checks the token: rejected -> ConfigEntryAuthFailed (reauth), unreachable -> ConfigEntryNotReady.
  unique-config-entry:
    status: done
    comment: >-
      Nature account id is the entry unique id; old entries are matched by token and adopt the id on next setup.
  # Silver
  action-exceptions:
    status: todo
    comment: >-
      send_light_mode raises ServiceValidationError for bad input; API failures in entity actions still only log.
  config-entry-unloading:
    status: done
    comment: >-
      Platforms unload, the climate local poller is cancelled via entry.async_on_unload; tested by a full setup/unload test.
  docs-configuration-parameters:
    status: done
    comment: >-
      README 'Options (Configure)' section.
  docs-installation-parameters:
    status: done
    comment: >-
      README 'Setup fields' section.
  entity-unavailable:
    status: todo
    comment: >-
      Remote reports availability; climate, light and sensor do not yet.
  integration-owner:
    status: done
    comment: >-
      codeowners: @nanosns (upstream), @imasaru (fork).
  log-when-unavailable:
    status: todo
    comment: >-
      Coordinator-based entities get this for free; non-coordinator paths need checking.
  parallel-updates:
    status: done
    comment: >-
      PARALLEL_UPDATES = 1 on command platforms (climate, light, remote), 0 on switch and, 0 on sensor.
  reauthentication-flow:
    status: done
    comment: >-
      reauth_confirm step, refuses a token from a different account.
  test-coverage:
    status: todo
    comment: >-
      Config flow, setup (incl. full load/unload), the light action and diagnostics are tested; platform entities are not (well under 95%).
  # Gold
  devices:
    status: done
    comment: >-
      Entities attach to Remo / appliance devices via device_info.
  diagnostics:
    status: done
    comment: >-
      diagnostics.py, token, serials, MACs, location and Remo IPs redacted.
  discovery:
    status: done
    comment: >-
      Zeroconf (_remo._tcp.local.) starts setup. A 2026-11-13 LAN browse on
      192.168.11.0/24 saw no Remo advertisements; public docs confirm the
      type and Remo-XXXXXX instance names. TXT keys were not observed.
  discovery-update-info:
    status: done
    comment: >-
      Discovery matches a known Remo by stored local IP, serial, MAC or
      name and updates the IP option keyed by the HA device registry id.
  docs-data-update:
    status: todo
  docs-examples:
    status: todo
  docs-known-limitations:
    status: todo
    comment: >-
      e.g. cloud rate limit, local IR only for Fujitsu AR-RFF2J.
  docs-supported-devices:
    status: todo
  docs-supported-functions:
    status: todo
  docs-troubleshooting:
    status: todo
  docs-use-cases:
    status: todo
  dynamic-devices:
    status: todo
    comment: >-
      New appliances need a reload today.
  entity-category:
    status: todo
  entity-device-class:
    status: todo
    comment: >-
      Sensors mostly have device classes; audit the rest.
  entity-disabled-by-default:
    status: todo
  entity-translations:
    status: todo
    comment: >-
      Needs has-entity-name first.
  exception-translations:
    status: todo
    comment: >-
      Setup and the light action use translated errors; entity actions do not.
  icon-translations:
    status: todo
    comment: >-
      No icons.json yet.
  reconfiguration-flow:
    status: done
    comment: >-
      reconfigure step replaces the token in place.
  repair-issues:
    status: todo
    comment: >-
      Candidate: warn when the cloud rate limit is hit repeatedly.
  stale-devices:
    status: todo
    # partial: retired lock entities are removed from the entity registry on setup.
    comment: >-
      Implement async_remove_config_entry_device or prune removed appliances.
  # Platinum
  async-dependency:
    status: done
    comment: >-
      The client is in-tree and fully asyncio (aiohttp).
  inject-websession:
    status: done
    comment: >-
      NatureRemoAPI takes Home Assistant's shared aiohttp session (async_get_clientsession); the token check uses it too.
  strict-typing:
    status: done
    comment: >-
      mypy --strict (mypy.ini, py.typed) covers the package; tests/test_typing.py
      enforces it. config_flow.py already passed before this work and was left
      unchanged so a parallel discovery branch can merge cleanly.
